[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidlens"
version = "0.1.0"
description = "Mechanistic interpretability of Semantic-ID generative recommenders"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "torch",
    "transformers",
    "pyyaml",
]

[project.scripts]
sidlens = "sidlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
