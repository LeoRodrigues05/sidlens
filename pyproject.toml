[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidlens"
version = "0.1.0"
description = "Mechanistic interpretability of Semantic-ID generative recommenders"
requires-python = ">=3.11"
# Unpinned on purpose: install the target cluster's own torch/CUDA build first.
# requirements/lock-*.txt records the exact environment results were produced in.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "torch",
    "transformers",
    "safetensors",
    "pyyaml",
]

[project.optional-dependencies]
# `sidlens bundle push/pull` (private HF dataset repos).
hub = ["huggingface_hub>=0.30"]
test = ["pytest"]

[project.scripts]
sidlens = "sidlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
